  heading: About
  body: |-
    Hi, I'm Nick. By day I'm a software developer (I built this site too); the rest of the time I'm usually standing very still next to a prairie dog enclosure.

    I've been taking photos for as long as I can remember, but only bought a proper camera two years ago. Most of what you see here comes from zoos and animal parks in the Netherlands. What I'm after isn't the perfect species shot but a bit of personality: a stare, a snack, two pups falling asleep on top of each other.

    Lately I've been pointing the camera at people too. If you'd like portraits taken, send me a message.
