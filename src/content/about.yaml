    heading: Over mij
    body: >-
      Hoi, ik ben Nick. Overdag ben ik software-engineer (deze site heb ik ook
      zelf gebouwd); de rest van de tijd sta ik meestal doodstil naast een
      prairiehondenverblijf.


      Ik fotografeer al zolang ik me kan herinneren, maar pas twee jaar geleden
      kocht ik een echte camera. Het meeste wat je hier ziet komt uit
      dierentuinen en parken in Nederland. Waar ik naar zoek is
      niet het perfecte plaatje van de soort, maar een beetje karakter: een
      starende blik, een hapje, twee jonkies die boven op elkaar in slaap
      vallen.


      De laatste tijd richt ik de camera ook op mensen. Wil je portretfoto's
      laten maken? Stuur me dan een bericht op Instagram.
