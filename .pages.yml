media:
  - name: photos
    label: Photos
    input: src/content/images
    output: images
    rename: safe
    extensions: [jpg, jpeg, webp]

content:
  - name: photos
    label: Photos
    type: file
    path: src/content/photos.yaml
    list: true
    fields:
      # No `slug` field here on purpose: it's generated once, at creation,
      # from `title` (see the add-photos skill and content.config.ts's
      # schema comment) and never regenerated afterwards. Exposing it as
      # an editable CMS field would invite exactly the edit that breaks
      # public/_redirects and any already-shared /photo/<slug>/ URL.
      - { name: src, label: Photo, type: image }
      - { name: title, label: Title, type: string, required: true }
      - { name: alt, label: Alt text, type: string, required: true }
      - { name: caption, label: Caption, type: string }
      - { name: date, label: Date, type: date }
      - { name: location, label: Location, type: string, description: "The zoo or park where this was taken. Leave blank if unconfirmed — never guess." }
      - name: tags
        label: Tags
        type: select
        options:
          multiple: true
          values: [wildlife, portrait]
      - { name: feature, label: Feature, type: boolean, default: false }
      - name: nl
        label: Dutch translation
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: alt, label: Alt text, type: string }
          - { name: caption, label: Caption, type: string }

  - name: about
    label: About
    type: file
    path: src/content/about.yaml
    list: true
    fields:
      - { name: id, label: ID, type: string }
      - { name: portrait, label: Portrait photo, type: image }
      - { name: portraitAlt, label: Portrait alt text, type: string }
      - { name: avatar, label: Avatar (square headshot), type: image, description: "Square crop of your face, shown in the small circle on the homepage. Leave empty to zoom into the portrait photo instead." }
      - { name: homeIntro, label: Homepage intro text, type: text }
      - { name: heading, label: About page heading, type: string, required: true }
      - { name: body, label: About page body, type: text, required: true }
      - name: facts
        label: Facts
        type: object
        list: true
        fields:
          - { name: label, type: string, required: true }
          - { name: value, type: string, required: true }
      - name: nl
        label: Dutch translation
        type: object
        fields:
          - { name: portraitAlt, label: Portrait alt text, type: string }
          - { name: homeIntro, label: Homepage intro text, type: text }
          - { name: heading, label: About page heading, type: string }
          - { name: body, label: About page body, type: text }
          - name: facts
            label: Facts
            type: object
            list: true
            fields:
              - { name: label, type: string, required: true }
              - { name: value, type: string, required: true }
